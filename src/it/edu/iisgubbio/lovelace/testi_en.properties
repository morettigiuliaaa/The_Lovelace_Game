dialogo1Ada=Teacher, teacher! Look, teacher! I did it! This is the result of my work, I believe the algorithm is finally correct. I\u2019ve spent so much time on this, but thanks to your teachings, I\u2019ve made it this far!
dialogo1Augusto=Hmm... let me see, Ada. If it truly is correct, it could revolutionize the world of science. But don\u2019t get your hopes up. Your work, no matter how much effort and brilliance it shows, might not be accepted. Revolution is not so easily achieved.
Strappo=*rips the paper with a bitter expression*
dialogo2Ada=No! Teacher, why did you do that? I worked day and night; I gave everything I had! How can you destroy what was my dream? You\u2019re my mentor how could you do this to me?
dialogo2Augusto=Because the world is not ready for you, Ada. You are a woman in an era that cannot tolerate your brilliance. Even if it were perfect, your work would be ignored, ridiculed. It\u2019s not your mind that\u2019s wrong, it\u2019s the time we live in. It\u2019s cruel, but necessary: I cannot let you face rejection so unjust.
dialogo3Augusto=Ada, every great achievement is like a journey full of obstacles. We don't always see immediate results, but every step brings you closer to your goal. Don't stop searching for the right pieces, even if the world isn't ready to accept them yet.
dialogo4Ada=If the world isn't ready for what I've created, then I'll be the one to prepare it. Every piece I find, every path I face, brings me closer to the truth. I won't stop, no matter how hard the journey is. This is only the beginning, and no obstacle can hold me back. Now, the journey begins.
