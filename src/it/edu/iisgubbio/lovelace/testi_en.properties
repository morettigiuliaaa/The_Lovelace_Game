dialogo1adaen= Teacher, teacher! Look, Teacher, i have come to the solution, this is the fruit of my labour, i do believe the algorithm is finally correct...
dialogo1augustoen= Hmm...  let me have a look, i shall check if it is indeed correct, i advise you to lower your expectations, however. Your work, no matter how hard it may have been, could still not be worthy.
dialogo2adaen= Ah... why did you rip it apart!? I've worked for weeks on this one solution, day and night! And now, you dare throw it away as if it was just trash?
dialogo2augustoen= It matters not. You are a woman, no matter the effort, in this field success is out of your reach. Maths, the sciences and logic... are paths best fit for minds well beyond your own, strong ones. You do not understand that such a thing doesn't belong to you. for you to be so stubborn to enter this world... you could cause a scandal, the world is not yet ready! I will put a Man up to this task, HE shall know how to rewrite your code, and he shall publish the Algorithm at once!