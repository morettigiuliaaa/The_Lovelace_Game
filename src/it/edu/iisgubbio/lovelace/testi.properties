dialogo1Ada=Maestro
dialogo1Augusto=Mmh... fammi vedere, Ada. Se è davvero giusto, potrebbe rivoluzionare il mondo della scienza. Ma non illuderti. Il tuo lavoro, per quanto impegno e genio ci siano, potrebbe non essere accettato. La rivoluzione non è così semplice da ottenere.
Strappo=*strappa il foglio con una smorfia di amarezza* 
dialogo2Ada=No! Maestro, perché l\u2019ha fatto? Ho lavorato giorno e notte, ho dato tutta me stessa! Come può distruggere ciò che rappresentava il mio sogno? Lei è il mio mentore, come può farmi questo?
dialogo2Augusto=Perché il mondo non è pronto per te, Ada. Sei una donna in un\u2019epoca che non tollera il tuo talento. Anche se fosse perfetto, il tuo lavoro sarebbe ignorato, deriso. Non è la tua mente a essere sbagliata, ma il tempo in cui viviamo. È crudele, ma necessario: non posso lasciarti affrontare un rifiuto così ingiusto.
dialogo3Augusto:Ada, ogni grande conquista è come un cammino pieno di ostacoli. Non sempre vediamo il risultato immediato, ma ogni passo ti avvicina al tuo obiettivo. Non smettere di cercare i pezzi giusti, anche se il mondo non è ancora pronto per accoglierli.
dialogo4Ada:Se il mondo non è ancora pronto per accogliere ciò che ho creato, allora sarò io a prepararlo. Ogni pezzo che troverò, ogni percorso che affronterò, mi condurrà più vicino alla verità. Non mi fermerò, non importa quanto arduo sarà il cammino. Questo è solo l'inizio, e nessuna difficoltà potrà fermarmi. Ora, il viaggio comincia.
