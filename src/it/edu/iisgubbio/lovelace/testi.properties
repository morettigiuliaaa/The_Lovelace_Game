domanda1=Ada Lovelace lavorò con Charles Babbage su un prototipo di computer. Come si chiamava questa macchina?
domanda2=L'algoritmo di Ada Lovelace, considerato il primo programma informatico della storia, era stato progettato per calcolare:
domanda3=Ada Lovelace intuì che le macchine programmabili potevano essere utilizzate anche per:
domanda4=Quale idea innovativa di Ada Lovelace è alla base della programmazione moderna?
1risposta1=A: Macchina dei numeri
1risposta2=B: Macchina analitica
1risposta3=C: Calcolatrice meccanica
1risposta4=D: Motore programmabile
2risposta1=A: Le radici quadrate
2risposta2=B: Il valore di \u03C0
2risposta3=C: I numeri di Bernoulli
2risposta4=D: La sequenza di Fibonacci
3risposta1=A: Creare opere d'arte e\n musica
3risposta2=B: Prevedere il futuro
3risposta3=C: Inventare altri\n algoritmi\n automaticamente
3risposta4=D: Fare lavori di casa
4risposta1=A: Le macchine possono\n solo fare calcoli\n matematici.
4risposta2=B: Le macchine devono\n essere usate solo\n dagli scienziati.
4risposta3=C: Le macchine devono\n essere costruite da\n materiali biologici.
4risposta4=D: Le macchine possono\n manipolare simboli,\n non solo numeri.
finale1Ada=Finalmente ce l\u2019ho fatta! Ho ricostruito l\u2019algoritmo, pezzo dopo pezzo, anche dopo che è stato distrutto. Questo non è solo un insieme di calcoli; è la mia visione, il frutto di ciò che possiamo ottenere se uniamo immaginazione e logica. È il futuro!
finale1Augusto=Devo ammetterlo, Ada, sono profondamente impressionato. Hai superato ogni aspettativa, andando oltre i limiti imposti dalla scienza e dalla società. Quello che hai creato non è solo un algoritmo, è un'opera di genio che potrebbe cambiare il corso della storia.
finale2Ada=Maestro, questo lavoro non ha senso se resta nascosto. Deve essere condiviso con il mondo. Voglio che tutti vedano ciò che siamo capaci di fare quando osiamo guardare oltre il presente. Non possiamo lasciare che la paura del cambiamento ci trattenga.
finale2Augusto=Hai ragione. Non posso più negarlo. Approvare la pubblicazione di questo lavoro significherà scatenare una rivoluzione. Non tutti ti sosterranno; alcuni cercheranno persino di ostacolarti. Ma il tuo genio non può restare nell\u2019ombra. Il mondo deve sapere, anche se sarà difficile.
finale3Ada=Se il mondo non è pronto, lo sarà presto. Perché questa è solo la prima pagina di un capitolo che cambierà tutto.
fine=Hai completato il gioco